# Build the demos and publish them to GitHub Pages.
# Each demo goes to its own folder: /imci-fever/, and /eligibility/ with one folder for each of its
# domains, for example /eligibility/wef/. The landing page is site/index.html.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: imci-fever
        working-directory: imci-fever
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build

      - name: eligibility
        working-directory: eligibility
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build

      - name: Assemble site
        run: |
          mkdir -p _site/imci-fever _site/eligibility
          cp -r imci-fever/dist/. _site/imci-fever/
          cp -r eligibility/dist/. _site/eligibility/
          cp -r site/. _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
