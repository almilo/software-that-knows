# Build the demos and publish them to GitHub Pages.
# Each demo goes to its own folder: /imci-fever/, /cloud-architecture/, /choices/<domain>/,
# /eligibility/<domain>/ and /car-insurance/. The landing page is site/index.html.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Check and build each demo
        run: |
          for demo in imci-fever cloud-architecture choices eligibility/react-bun car-insurance; do
            (cd "$demo" && bun install --frozen-lockfile && bun run typecheck && bun run test && bun run build)
          done

      - name: Assemble site
        run: |
          for demo in imci-fever cloud-architecture choices eligibility car-insurance; do
            app="$demo"; [ "$demo" = eligibility ] && app=eligibility/react-bun
            mkdir -p "_site/$demo"
            cp -r "$app/dist/." "_site/$demo/"
          done
          cp -r site/. _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
