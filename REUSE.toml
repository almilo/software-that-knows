version = 1

# Code and documentation: MIT.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 almilo"
SPDX-License-Identifier = "MIT"

# Knowledge models, the extracts of the DAK and every file generated from them
# are adaptations of the WHO Digital adaptation kit for child health (0-59
# months) in humanitarian emergencies (2024), so they keep its licence.
[[annotations]]
path = ["imci-fever/ontology/**", "imci-fever/generated/**", "imci-fever/source/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2024 World Health Organization", "2026 almilo"]
SPDX-License-Identifier = "CC-BY-NC-SA-3.0-IGO"
