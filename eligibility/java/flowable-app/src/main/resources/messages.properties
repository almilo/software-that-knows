# The texts of the Flowable stack: the process, the tasks and the pages. The texts of the processes
# (questions, findings, next steps, articles) and of the form come from the knowledge model.
app.title=Applications in a process
app.intro=Each application runs through one BPMN process in Flowable. The knowledge model decides in a service task; what is missing goes back to the applicant; each next step that the model derives becomes a task of the office; then a person decides.
app.demo=Demonstration only: there is no login, and the server forgets everything on restart.
