app.title=Anträge in einem Prozess
app.intro=Jeder Antrag durchläuft einen BPMN-Prozess in Flowable. Das Wissensmodell entscheidet in einer Service-Task; was fehlt, geht an die antragstellende Person zurück; jeder nächste Schritt, den das Modell ableitet, wird eine Aufgabe des Amts; dann entscheidet eine Person.
app.demo=Nur eine Demonstration: Es gibt kein Login, und der Server vergisst beim Neustart alles.
