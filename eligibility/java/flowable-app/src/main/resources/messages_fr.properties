app.title=Demandes dans un processus
app.intro=Chaque demande suit un processus BPMN dans Flowable. Le modèle de connaissances décide dans une tâche de service ; ce qui manque retourne à la personne requérante ; chaque prochaine étape que le modèle déduit devient une tâche de l'office ; puis une personne décide.
app.demo=Démonstration seulement : il n'y a pas de connexion, et le serveur oublie tout au redémarrage.
