app.title=Domande in un processo
app.intro=Ogni domanda segue un processo BPMN in Flowable. Il modello di conoscenza decide in un service task; ciò che manca torna alla persona richiedente; ogni prossimo passo che il modello deduce diventa un compito dell'ufficio; poi decide una persona.
app.demo=Solo una dimostrazione: non c'è login, e il server dimentica tutto al riavvio.
